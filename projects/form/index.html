<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
   <header>
    <h1>Pickleball Workshop Sign-Up</h1>
   </header> 

   <main>
    <h2>Registration Form</h2>
    <form action="#" method="post">
        <fieldset>
            <legend>Your information</legend>

            <div class="form-row">
                <label for="full-name">Full name:</label> 
                <input type="text" id="full-name" name="full-name" required>
            </div>

            <div class="form-row">
                <label for="email">Email address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-row">
                <label for="phone">Phone number:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-row">
                <label for="password">Create a password:</label>
                <input type="password" id="password" name="password" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Workshop details</legend>

            <div class="form-row">
                <label for="workshop">Choose a workshop:</label>
                <select id="workshop" name="workshop" required>
                    <option value="">Select one</option>
                    <option value="beginner">Pickleball beginner level</option>
                    <option value="intermediate">Pickleball intermediate level</option>
                    <option value="professional">Pickleball professional level</option>
                </select>
            </div>

            <div class="form-row">
                <label for="workshop">Preferred date:</label>
                <input type="date" id="workshop-date" name="workshop-date">
            </div>

            <div class="form-row choice-row">
                <span class="group-label">How will you attend?</span>
                <div class="choices">
                    <label>
                        <input type="radio" name="attendance" value="in-person" required>
                        In person
                    </label>
                    <label>
                        <input type="radio" name="attendance" value="online">
                        Online
                    </label>
                </div>
            </div>

            <div class="form-row">
                <label for="comments">Questions or Comments:</label>
                <textarea id="comments" name="comments" rows="4"></textarea>
            </div>
        </fieldset>

        <div class="check-row">
            <label>
                <input type="checkbox" name="updates" value="yes">
                Send me workshop updates by email.
            </label>
        </div>

        <div class="check-row">
            <label>
                <input type="checkbox" name="agree" value="yes" required>
                I agree to the registration terms.
            </label>
        </div>
        <button type="submit">Submit Registration</button>
    </form>
   </main>
   <footer>
    <p>&copy; Faonelua Lose 2026</p>   
</footer>
</body>
</html>
